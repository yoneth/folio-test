<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motion Reel 2026</title>
<style>
  @font-face { font-family: 'Archivo Black'; src: url(fonts/ArchivoBlack.woff2) format('woff2'); font-display: block; }
  @font-face { font-family: 'Space Grotesk'; src: url(fonts/SpaceGrotesk.woff2) format('woff2'); font-weight: 300 700; font-display: block; }
  @font-face { font-family: 'JetBrains Mono'; src: url(fonts/JetBrainsMono.woff2) format('woff2'); font-weight: 500; font-display: block; }
  @font-face { font-family: 'Instrument Serif'; src: url(fonts/InstrumentSerif-Italic.woff2) format('woff2'); font-style: italic; font-display: block; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { position: absolute; inset: 0; margin: auto; width: 100vw; height: 56.25vw; max-height: 100vh; max-width: 177.78vh; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
/* ------------------------------------------------------------------------
   MOTION REEL 2026 — a 15s showreel.
   Every pixel is a pure function of time t, so any frame can be rendered
   in any order (parallel rendering) and sub-frames can be accumulated for
   true shutter motion blur. 120 BPM: one beat = 0.5s, 30 beats total.
   ------------------------------------------------------------------------ */
const W = 1920, H = 1080, CX = W / 2, CY = H / 2, FPS = 60, DUR = 15;
const TAU = Math.PI * 2;
const COL = { ink: '#0B0B0E', paper: '#F2EEE5', red: '#FF3D1F', blue: '#2D4BFF', lime: '#D4FF3A' };
const F = { display: '"Archivo Black"', mono: '"JetBrains Mono"', serif: '"Instrument Serif"', grotesk: '"Space Grotesk"' };

const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const ease = {
  lin: x => x,
  inQuad: x => x * x,
  outQuad: x => 1 - (1 - x) * (1 - x),
  inCubic: x => x * x * x,
  outCubic: x => 1 - (1 - x) ** 3,
  inOutCubic: x => x < .5 ? 4 * x * x * x : 1 - (-2 * x + 2) ** 3 / 2,
  inQuart: x => x ** 4,
  outQuart: x => 1 - (1 - x) ** 4,
  inOutQuart: x => x < .5 ? 8 * x ** 4 : 1 - (-2 * x + 2) ** 4 / 2,
  outQuint: x => 1 - (1 - x) ** 5,
  inExpo: x => x === 0 ? 0 : 2 ** (10 * x - 10),
  outExpo: x => x === 1 ? 1 : 1 - 2 ** (-10 * x),
  inOutExpo: x => x === 0 ? 0 : x === 1 ? 1 : x < .5 ? 2 ** (20 * x - 10) / 2 : (2 - 2 ** (-20 * x + 10)) / 2,
  outBack: (x, s = 1.70158) => 1 + (s + 1) * (x - 1) ** 3 + s * (x - 1) ** 2,
  outElastic: x => x === 0 ? 0 : x === 1 ? 1 : 2 ** (-10 * x) * Math.sin((x * 10 - .75) * TAU / 3) + 1,
};
function rng(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const font = (px, fam, style = '') => `${style} ${px}px ${fam}`;
const qt = t => Math.round(t * FPS) / FPS; // quantise to frame (crisp readouts under motion blur)

/* ---------- canvases ---------- */
const cv = document.getElementById('c');
const out = cv.getContext('2d');
const mk = (opts) => { const c = document.createElement('canvas'); c.width = W; c.height = H; return [c, c.getContext('2d', opts)]; };
const [sceneCv, sg] = mk();
const [auxCv, ag] = mk({ willReadFrequently: true });

/* ---------- text layout cache ---------- */
const layoutCache = new Map();
function layout(text, size, fam, style = '') {
  const key = text + '|' + size + '|' + fam + style;
  if (layoutCache.has(key)) return layoutCache.get(key);
  ag.font = font(size, fam, style);
  const ch = [...text], xs = [];
  for (let i = 0; i < ch.length; i++) xs.push(ag.measureText(ch.slice(0, i).join('')).width);
  const m = ag.measureText(text);
  const capH = ag.measureText('H').actualBoundingBoxAscent;
  const L = { ch, xs, w: m.width, capH };
  layoutCache.set(key, L);
  return L;
}

/* ---------- physics: ballistic bounce track ---------- */
// Falls from y0 at t0 so that it hits `ground` at imps[0], then bounces with
// constant gravity g between successive impact times (heights follow g*T^2/8).
function track(t, c) {
  const g = c.g, imps = c.imps;
  if (t < c.t0) return { y: c.y0, vy: 0, pre: true };
  if (t < imps[0]) {
    const T = imps[0] - c.t0, D = c.ground - c.y0, v0 = (D - .5 * g * T * T) / T, u = t - c.t0;
    return { y: c.y0 + v0 * u + .5 * g * u * u, vy: v0 + g * u };
  }
  for (let k = 0; k < imps.length - 1; k++) if (t < imps[k + 1]) {
    const T = imps[k + 1] - imps[k], u = t - imps[k];
    return { y: c.ground - (g * T / 2) * u + .5 * g * u * u, vy: -g * T / 2 + g * u };
  }
  return { y: c.ground, vy: 0, rest: true };
}
function impactSquash(t, imps, str, w = .055) {
  let q = 0;
  imps.forEach((ti, k) => { const d = Math.abs(t - ti); if (d < w) q = Math.max(q, str[k] * (1 - d / w) ** 2); });
  return q;
}

/* ======================================================================
   SCENE 1 (0–2s) — SQUASH & STRETCH. A ball drops, bounces on the 8ths
   and 16ths, anticipates, launches, and swallows the frame.
   ====================================================================== */
const S1C = { floor: 760, R: 64, t0: .15, y0: -150, imps: [.5, 1.0, 1.25, 1.375], g: 9600, str: [1, .8, .5, .3] };
function ball1(t) {
  const { floor, R } = S1C;
  const tr = track(t, { t0: S1C.t0, y0: S1C.y0, ground: floor - R, imps: S1C.imps, g: S1C.g });
  let y = tr.y, sy = 1, r = R;
  if (t < 1.375) {
    sy = 1 + clamp(Math.abs(tr.vy) / 5200, 0, .34);
    const q = impactSquash(t, S1C.imps, S1C.str);
    if (q > .03) { sy = 1 - .5 * q; y = floor - R * sy; }
    else y = Math.min(y, floor - R * sy);
  } else if (t < 1.6) {
    const a = ease.inOutCubic(prog(t, 1.42, 1.6));
    sy = 1 - .42 * a; y = floor - R * sy;
  } else {
    const l = prog(t, 1.6, 1.82);
    sy = lerp(.58, 1.5, ease.outExpo(prog(t, 1.6, 1.65)));
    sy = lerp(sy, 1, ease.outCubic(prog(t, 1.65, 1.82)));
    y = lerp(floor - R * .58, CY, ease.outQuart(l));
    r = R * lerp(1, 18.6, ease.inExpo(prog(t, 1.76, 1.98)));
  }
  return { x: CX, y, sx: 1 / sy, sy, r, vy: tr.vy };
}
function S1(g, t) {
  g.fillStyle = COL.ink; g.fillRect(0, 0, W, H);
  const { floor } = S1C;
  // ruler floor
  const grow = ease.outExpo(prog(t, .02, .7));
  const fade = 1 - prog(t, 1.62, 1.8);
  g.globalAlpha = .32 * fade;
  g.fillStyle = COL.paper;
  g.fillRect(CX - 640 * grow, floor, 1280 * grow, 2);
  for (let x = -640; x <= 640; x += 32) {
    if (Math.abs(x) > 640 * grow) continue;
    const big = x % 160 === 0;
    g.globalAlpha = (big ? .35 : .16) * fade;
    g.fillRect(CX + x, floor + 10, 2, big ? 18 : 9);
  }
  g.globalAlpha = 1;

  // impact rings + dust
  S1C.imps.forEach((ti, k) => {
    const p = prog(t, ti, ti + .6), s = S1C.str[k];
    if (p <= 0 || p >= 1) return;
    const rx = 64 + 460 * ease.outExpo(p) * s;
    g.strokeStyle = COL.paper; g.globalAlpha = (1 - p) * .7 * s; g.lineWidth = 2;
    g.beginPath(); g.ellipse(CX, floor, rx, rx * .14, 0, 0, TAU); g.stroke();
    const rr = rng(100 + k);
    for (let m = 0; m < 12; m++) {
      const a = Math.PI + (m + .5) / 12 * Math.PI, sp = (260 + rr() * 420) * s;
      const u = (t - ti);
      const dx = Math.cos(a) * sp * u * 1.6, dy = Math.sin(a) * sp * u + 1400 * u * u;
      if (dy > 4) continue;
      g.globalAlpha = (1 - p) * s;
      g.fillStyle = m % 3 === 0 ? COL.red : COL.paper;
      g.fillRect(CX + dx, floor + dy - 3, 5, 5);
    }
  });
  g.globalAlpha = 1;

  // onion skins
  for (let k = 8; k >= 1; k--) {
    const tk = t - k * .032;
    if (tk < .17 || tk > 1.6) continue;
    const b = ball1(tk);
    g.save(); g.globalAlpha = .38 * (1 - k / 9); g.strokeStyle = COL.paper; g.lineWidth = 2;
    g.translate(b.x, b.y); g.scale(b.sx, b.sy);
    g.beginPath(); g.arc(0, 0, b.r, 0, TAU); g.restore(); g.stroke();
  }

  // the ball
  const b = ball1(t);
  g.save(); g.translate(b.x, b.y); g.scale(b.sx, b.sy);
  g.fillStyle = COL.red; g.beginPath(); g.arc(0, 0, b.r, 0, TAU); g.fill(); g.restore();

  // live spec readout
  const tq = qt(t);
  if (tq > .2 && tq < 1.6) {
    const bq = ball1(tq);
    const lx = bq.x + 170, ly = bq.y - 120;
    g.globalAlpha = prog(tq, .2, .3) * (1 - prog(tq, 1.5, 1.6));
    g.strokeStyle = COL.paper; g.lineWidth = 1.5;
    g.beginPath(); g.moveTo(bq.x + 54, bq.y - 40); g.lineTo(lx - 20, ly + 12); g.lineTo(lx + 230, ly + 12); g.stroke();
    g.fillStyle = COL.paper; g.font = font(17, F.mono); g.textAlign = 'left';
    g.fillText(`SCALE.Y  ${bq.sy.toFixed(2)}`, lx, ly - 30);
    g.fillText(`SCALE.X  ${bq.sx.toFixed(2)}`, lx, ly - 4);
    g.globalAlpha = .55;
    g.fillText(`VEL.Y    ${Math.round(bq.vy || 0)}`, lx, ly + 40);
    g.globalAlpha = 1;
  }
}

/* ======================================================================
   SCENE 2 (2–4s) — KINETIC TYPE. One word per beat, whip-panel cuts,
   then the frame slices apart into the grid.
   ====================================================================== */
const WORDS = [
  { w: 'I', bg: COL.red, fg: COL.ink, note: '(pronoun)' },
  { w: 'MAKE', bg: COL.ink, fg: COL.paper, note: '(verb)' },
  { w: 'THINGS', bg: COL.paper, fg: COL.ink, note: '(noun, plural)' },
  { w: 'MOVE.', bg: COL.blue, fg: COL.lime, note: '(verb, imperative)' },
];
function wordSize(word) {
  const L = layout(word, 100, F.display);
  return Math.min(860, Math.floor(100 * 1540 / L.w));
}
function wordScene(g, i, lt) {
  const Wd = WORDS[i];
  g.fillStyle = Wd.bg; g.fillRect(0, 0, W, H);
  const size = wordSize(Wd.w), L = layout(Wd.w, size, F.display);
  const s = lerp(1.16, 1, ease.outCubic(clamp(lt / .5)));
  g.save();
  g.translate(CX, CY); g.scale(s, s); g.translate(-CX, -CY);
  const x0 = CX - L.w / 2, base = CY + L.capH / 2;
  g.save();
  g.beginPath(); g.rect(0, base - L.capH - size * .3, W, L.capH + size * .34); g.clip();
  g.font = font(size, F.display); g.textAlign = 'left'; g.fillStyle = Wd.fg;
  L.ch.forEach((c, j) => {
    const p = ease.outExpo(clamp((lt - j * .038) / .34));
    let yo = (1 - p) * size * .95, rot = 0;
    if (i === 3) { // MOVE. — letters hop in a travelling wave
      const h = clamp((lt - .16 - j * .045) / .2);
      yo -= Math.sin(h * Math.PI) * 90;
      rot = -Math.sin(h * Math.PI) * .12;
    }
    const lx = x0 + L.xs[j];
    g.save(); g.translate(lx, base + yo); g.rotate(rot); g.fillText(c, 0, 0); g.restore();
  });
  g.restore();
  // dictionary note
  const na = ease.outCubic(prog(lt, .1, .32));
  g.globalAlpha = na * .9; g.fillStyle = Wd.fg; g.font = font(58, F.serif, 'italic'); g.textAlign = 'right';
  g.fillText(Wd.note, x0 + L.w, base + 92 + (1 - na) * 24);
  g.globalAlpha = 1; g.textAlign = 'left';
  g.restore();
  // whip panel into next word (lands exactly on the next beat)
  if (i < 3) {
    const pp = prog(lt, .41, .5);
    if (pp > 0) { const hh = H * ease.inQuart(pp); g.fillStyle = WORDS[i + 1].bg; g.fillRect(0, H - hh, W, hh); }
  }
}
function S2(g, t) {
  const i = Math.min(3, Math.floor((t - 2) / .5)), lt = t - 2 - i * .5;
  if (t < 3.82) { wordScene(g, i, lt); return; }
  // slice transition: strips fly apart revealing the grid
  S3(g, t);
  const n = 8, sh = H / n;
  for (let k = 0; k < n; k++) {
    const p = ease.inQuart(prog(t, 3.82 + k * .012, 3.99));
    const dir = k % 2 ? 1 : -1;
    g.save(); g.beginPath(); g.rect(0, k * sh, W, sh + 1); g.clip();
    g.translate(dir * W * 1.06 * p, 0);
    wordScene(g, 3, lt);
    g.restore();
  }
}

/* ======================================================================
   SCENE 3 (4–6s) — SYSTEMS. A 16x9 grid of shapes; every beat a wave
   ripples through, morphing circle <-> diamond and cycling colour. Then
   it collapses into a vortex and an iris inverts the world.
   ====================================================================== */
const GC = 16, GR = 9, CELL = 120;
const WAVES = [{ t: 4.0, x: CX, y: CY }, { t: 4.5, x: 0, y: 0 }, { t: 5.0, x: W, y: H }, { t: 5.5, x: CX, y: CY }];
const GRID_COLS = [COL.ink, COL.red, COL.blue];
function gridPos(i, j, t) {
  const x = (i + .5) * CELL, y = (j + .5) * CELL;
  const sw = ease.inCubic(prog(t, 5.62, 6.5));
  if (sw <= 0) return [x, y];
  const dx = x - CX, dy = y - CY, d = Math.hypot(dx, dy);
  const a = Math.atan2(dy, dx) + sw * (2.6 - d / 900);
  const rr = d * (1 - .45 * sw);
  return [CX + Math.cos(a) * rr, CY + Math.sin(a) * rr];
}
function gridCell(i, j, t) {
  const x0 = (i + .5) * CELL, y0 = (j + .5) * CELL;
  let k = 0, bump = 0;
  for (const w of WAVES) {
    const d = Math.hypot(x0 - w.x, y0 - w.y);
    const p = clamp((t - w.t - d / 2700) / .36);
    k += ease.outBack(p, 2.4);
    bump += Math.sin(Math.PI * p);
  }
  let size = 60 + 34 * bump;
  let round = (1 + Math.cos(Math.PI * k)) / 2;
  const sh = ease.inOutCubic(prog(t, 5.6, 5.92));
  size = lerp(size, 12, sh); round = lerp(round, 1, sh);
  const [x, y] = gridPos(i, j, t);
  return { x, y, size, rot: k * Math.PI / 4, round, col: GRID_COLS[((Math.round(k) % 3) + 3) % 3] };
}
function drawGrid(g, t, override) {
  for (let j = 0; j < GR; j++) for (let i = 0; i < GC; i++) {
    const c = gridCell(i, j, t);
    g.save(); g.translate(c.x, c.y); g.rotate(c.rot);
    g.fillStyle = override || c.col;
    const s = c.size, r = (s / 2) * c.round;
    g.beginPath(); g.roundRect(-s / 2, -s / 2, s, s, r); g.fill();
    g.restore();
  }
}
function S3(g, t) {
  g.fillStyle = COL.paper; g.fillRect(0, 0, W, H);
  drawGrid(g, t);
  const ir = 1160 * ease.inQuart(prog(t, 5.72, 6.0));
  if (ir > 0) {
    g.save(); g.beginPath(); g.arc(CX, CY, ir, 0, TAU); g.clip();
    g.fillStyle = COL.ink; g.fillRect(0, 0, W, H);
    drawGrid(g, t, COL.paper);
    g.restore();
  }
}

/* ======================================================================
   SCENE 4 (6–9s) — PARTICLES. The grid's dots become 2,200 particles:
   sphere -> torus -> the word MOTION -> explosion.
   ====================================================================== */
const NP = 2200;
let P = null;
function initParticles() {
  const r = rng(7);
  // sample "MOTION" glyph pixels
  ag.clearRect(0, 0, W, H);
  const L = layout('MOTION', 100, F.display);
  const size = Math.floor(100 * 1240 / L.w), L2 = layout('MOTION', size, F.display);
  ag.font = font(size, F.display); ag.fillStyle = '#fff'; ag.textAlign = 'left';
  ag.fillText('MOTION', CX - L2.w / 2, CY + L2.capH / 2);
  const img = ag.getImageData(0, 0, W, H).data, pts = [];
  for (let y = 0; y < H; y += 3) for (let x = 0; x < W; x += 3) if (img[(y * W + x) * 4 + 3] > 128) pts.push([x, y]);
  ag.clearRect(0, 0, W, H);
  // shuffle pts deterministically
  for (let i = pts.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [pts[i], pts[j]] = [pts[j], pts[i]]; }
  P = [];
  for (let p = 0; p < NP; p++) {
    const y = 1 - (p + .5) / NP * 2, rad = Math.sqrt(1 - y * y), th = p * 2.399963;
    const sphere = [Math.cos(th) * rad * 330, y * 330, Math.sin(th) * rad * 330];
    const u = Math.floor(p / 20) / (NP / 20) * TAU, v = (p % 20) / 20 * TAU + u * 3;
    const torus = [(290 + 110 * Math.cos(v)) * Math.cos(u), 110 * Math.sin(v), (290 + 110 * Math.cos(v)) * Math.sin(u)];
    const tp = pts[p % pts.length];
    const c = p % (GC * GR);
    const roll = r();
    P.push({
      sphere, torus, text: [tp[0] + (r() - .5) * 2, tp[1] + (r() - .5) * 2],
      gi: c % GC, gj: Math.floor(c / GC),
      jit: [(r() - .5) * 2, (r() - .5) * 2],
      dl: r(), size: 2.2 + r() * 1.8,
      col: roll < .13 ? COL.red : roll < .19 ? COL.lime : COL.paper,
      dir: r() * TAU, sp: .6 + r(),
    });
  }
  // draw order: paper first, accents on top
  P.sort((a, b) => (a.col === COL.paper ? 0 : 1) - (b.col === COL.paper ? 0 : 1));
}
function project(v, ry, rx) {
  const [x, y, z] = v;
  const x1 = x * Math.cos(ry) + z * Math.sin(ry), z1 = -x * Math.sin(ry) + z * Math.cos(ry);
  const y1 = y * Math.cos(rx) - z1 * Math.sin(rx), z2 = y * Math.sin(rx) + z1 * Math.cos(rx);
  const k = 1100 / (1100 + z2);
  return [CX + x1 * k, CY + y1 * k, k];
}
function S4(g, t) {
  g.fillStyle = COL.ink; g.fillRect(0, 0, W, H);
  const ry = (t - 6) * 1.25, rxS = .32 + .12 * Math.sin(t * 1.3), rxT = 1.05;

  // orbit decoration
  const oa = prog(t, 6.4, 6.8) * (1 - prog(t, 7.85, 8.05));
  if (oa > 0) {
    g.save(); g.translate(CX, CY); g.rotate(-.28); g.globalAlpha = oa;
    g.strokeStyle = COL.red; g.lineWidth = 1.5; g.beginPath(); g.ellipse(0, 0, 500, 120, 0, 0, TAU); g.stroke();
    const sa = t * 2.6; g.fillStyle = COL.red; g.beginPath(); g.arc(Math.cos(sa) * 500, Math.sin(sa) * 120, 9, 0, TAU); g.fill();
    g.rotate(.62); g.globalAlpha = oa * .35; g.strokeStyle = COL.paper; g.setLineDash([4, 10]);
    g.beginPath(); g.ellipse(0, 0, 560, 90, 0, 0, TAU); g.stroke(); g.setLineDash([]);
    g.restore();
  }

  // blue iris into scene 5 (under the particles)
  const ir = 1160 * ease.inExpo(prog(t, 8.82, 9.0));
  if (ir > 0) { g.fillStyle = COL.blue; g.beginPath(); g.arc(CX, CY, ir, 0, TAU); g.fill(); }

  const ex = ease.inExpo(prog(t, 8.74, 9.0));
  for (const q of P) {
    const a = ease.inOutCubic(prog(t, 6.0 + q.dl * .3, 6.62 + q.dl * .3));
    const b = ease.inOutCubic(prog(t, 7.15 + q.dl * .25, 7.72 + q.dl * .25));
    const c = ease.inOutQuart(prog(t, 7.9 + q.dl * .28, 8.42 + q.dl * .28));
    const gp = gridPos(q.gi, q.gj, t), jt = 9 * prog(t, 6, 6.5);
    const sp = project(q.sphere, ry, rxS), tp = project(q.torus, ry + .5, rxT);
    let x = gp[0] + q.jit[0] * jt, y = gp[1] + q.jit[1] * jt, k = 1, sz = 11;
    x = lerp(x, sp[0], a); y = lerp(y, sp[1], a); k = lerp(1, sp[2], a); sz = lerp(sz, q.size * sp[2], a);
    x = lerp(x, tp[0], b); y = lerp(y, tp[1], b); k = lerp(k, tp[2], b); sz = lerp(sz, q.size * tp[2], b);
    x = lerp(x, q.text[0], c); y = lerp(y, q.text[1], c); k = lerp(k, 1, c); sz = lerp(sz, 4.6, c);
    if (ex > 0) {
      x += (x - CX) * ex * 2.4 + Math.cos(q.dir) * q.sp * 700 * ex;
      y += (y - CY) * ex * 2.4 + Math.sin(q.dir) * q.sp * 700 * ex;
    }
    const depth = clamp((k - .76) / .5);
    g.globalAlpha = lerp(1, lerp(.3, 1, depth), clamp(a + b) * (1 - c));
    g.fillStyle = a < .5 ? COL.paper : q.col;
    g.fillRect(x - sz / 2, y - sz / 2, sz, sz);
  }
  g.globalAlpha = 1;

  // readout
  const tq = qt(t);

/* ======================================================================
   SCENE 5 (9–11s) — TIMING. Three easings, side by side, with their

   ====================================================================== */
const LANES = [

/* ======================================================================
   SCENE 6 (11–13s) — CUTS. Eight micro-pieces, a quarter second each.
   ====================================================================== */
function mBurst(g, p) {

/* ======================================================================
   SCENE 7 (13–15s) — IDENTITY. The wordmark lands; the opening ball
   returns as the full stop.
   ====================================================================== */
const S7C = (() => ({}))();
function s7Layout() {
  if (S7C.L) return S7C;

  const dotR = size * .1, gap = size * .07, blockW = L.w + gap + dotR * 2;
  Object.assign(S7C, { size, L, dotR, gap, blockW, x0: CX - blockW / 2, base: CY + L.capH / 2 - 50 });

/* ---------- scene dispatch ---------- */
function drawScene(g, t) {
  g.save();
  g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; g.textAlign = 'left'; g.textBaseline = 'alphabetic';
  if (t < 2) S1(g, t);

/* ---------- HUD ---------- */
const SCENES = [

  [9, '05  TIMING'], [11, '06  CUTS'], [13, '07  IDENTITY'],

  g.textAlign = 'right';
  g.fillText(`TC 00:00:${String(ss).padStart(2, '0')}:${String(ff).padStart(2, '0')}`, W - 88, 92);
  g.globalAlpha = a * .55; g.fillText('120 BPM', W - 88, 116); g.globalAlpha = a;

  g.textAlign = 'left';

/* ---------- post: grain + vignette ---------- */
const grains = [];

    const c = document.createElement('canvas'); c.width = c.height = 256;
    const x = c.getContext('2d'), id = x.createImageData(256, 256);

/* ---------- camera shake on the big hits ---------- */
const HITS = [[.5, .5], [2.0, 1], [4.0, .5], [6.0, 1], [8.0, .7], [11.0, .6], [13.0, 1]];

  let a = 0;

  if (a <= 0) return [0, 0, 0];
  const ox = (Math.sin(t * 97) + Math.sin(t * 151) * .6) * 9 * a, oy = (Math.cos(t * 83) + Math.sin(t * 131) * .6) * 9 * a;
  return [ox, oy, .025 * a];

/* ---------- frame render with accumulation motion blur ---------- */

    drawScene(sg, t);

}
window.renderFrame = (fi, samples = 6) => { renderAt(fi / FPS, samples); return true; };

window.READY = (async () => {
  await Promise.all([
    document.fonts.load('100px "Archivo Black"'), document.fonts.load('100px "JetBrains Mono"'),
    document.fonts.load('italic 100px "Instrument Serif"'), document.fonts.load('500 100px "Space Grotesk"'),
  ]);
  initGrain(); initParticles(); s7Layout();
  return true;
})();

// Live preview when opened directly (no ?render): loops in real time.
if (!/render/.test(location.search)) {
  window.READY.then(() => {
    const m = location.search.match(/t=([\d.]+)/);
    let start = performance.now() - (m ? +m[1] * 1000 : 0), paused = false, pt = 0;
    cv.addEventListener('click', () => { paused = !paused; if (!paused) start = performance.now() - pt * 1000; });
    (function loop(now) {
      if (!paused) { pt = ((now - start) / 1000) % DUR; renderAt(pt, 1); }
      requestAnimationFrame(loop);
    })(performance.now());
  });
}
</script>
</body>
</html>
